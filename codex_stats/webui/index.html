<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Token 统计</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Codex Token 统计</div>
    <div class="top-actions">
      <button id="refreshBtn" class="btn primary" type="button">刷新数据</button>
    </div>
  </header>

  <main>
    <section class="periodbar">
      <div class="periods" id="periods">
        <button class="period-btn active" data-period="7d" type="button">近7天</button>
        <button class="period-btn" data-period="today" type="button">今天</button>
        <button class="period-btn" data-period="month" type="button">本月</button>
        <button class="period-btn" data-period="year" type="button">今年</button>
        <button class="period-btn" data-period="all" type="button">全部</button>
      </div>
      <div class="custom-range">
        <input type="datetime-local" id="fromDate" aria-label="开始时间">
        <span class="range-sep">至</span>
        <input type="datetime-local" id="toDate" aria-label="结束时间">
        <button id="applyCustom" class="btn" type="button">应用</button>
      </div>
    </section>

    <section class="cards" id="cards"></section>

    <section class="grid">
      <div class="panel trend-panel">
        <div class="panel-title">每日趋势</div>
        <div class="chart" id="trend"></div>
      </div>
      <div class="panel">
        <div class="panel-title">供应商</div>
        <div class="breakdown" id="providers"></div>
      </div>
      <div class="panel">
        <div class="panel-title">模型</div>
        <div class="breakdown" id="models"></div>
      </div>
      <div class="panel project-panel">
        <div class="panel-title">项目排行</div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>项目</th><th>任务数</th><th>轮次</th><th>总Token</th></tr>
            </thead>
            <tbody id="projectsBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="panel tasks-panel">
      <div class="panel-title tasks-head">
        <span>任务明细</span>
        <div class="task-filters">
          <input id="searchInput" type="search" placeholder="搜索任务或目录">
          <select id="projectFilter" aria-label="项目筛选"></select>
          <select id="providerFilter" aria-label="供应商筛选"></select>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>任务</th>
              <th>项目</th>
              <th>供应商</th>
              <th>模型</th>
              <th>轮次</th>
              <th>时段Token</th>
            </tr>
          </thead>
          <tbody id="tasksBody"></tbody>
        </table>
      </div>
      <div class="pager">
        <button id="prevBtn" class="btn" type="button">上一页</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" class="btn" type="button">下一页</button>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span id="modalTitle"></span>
        <button id="closeModal" class="btn" type="button">关闭</button>
      </div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-project-row">
        <label for="projectInput">项目归属</label>
        <input id="projectInput" type="text" placeholder="输入项目名称">
        <button id="saveProject" class="btn primary" type="button">保存</button>
        <button id="resetProject" class="btn" type="button">恢复自动</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>轮次</th><th>时间</th><th>输入</th><th>缓存输入</th><th>输出</th><th>思考</th><th>Total</th></tr>
          </thead>
          <tbody id="turnsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
